<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Manga V3.2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;900&display=swap');

        body {
            margin: 0; padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            touch-action: manipulation;
            -webkit-user-select: none; user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%; height: 100vh;
            background: #4ec0ca;
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* --- UI SCREENS --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            transition: opacity 0.2s;
        }
        .hidden { display: none !important; }

        h1 { font-family: 'Bangers'; font-size: 3.5rem; color: #f1c40f; text-shadow: 3px 3px #e67e22; margin: 0 0 20px 0; letter-spacing: 2px;}

        /* --- BOUTON POUVOIR --- */
        #ability-container {
            position: absolute; bottom: 40px; right: 30px; z-index: 20;
            display: flex; flex-direction: column; align-items: center;
        }

        #ability-btn {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #ee5253);
            border: 4px solid #fff;
            box-shadow: 0 8px 0 #b33939, 0 15px 20px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; cursor: pointer; position: relative;
            overflow: hidden; transition: transform 0.1s, box-shadow 0.1s;
        }
        
        #ability-btn:active {
            transform: translateY(8px); box-shadow: 0 0 0 #b33939, 0 5px 10px rgba(0,0,0,0.4);
        }

        #cd-mask {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background: rgba(0, 0, 0, 0.7); transition: height 0.1s linear; pointer-events: none;
        }

        .ability-label {
            margin-top: 10px; font-family: 'Bangers'; color: white;
            text-shadow: 1px 1px 0 #000; font-size: 1.2rem; pointer-events: none;
        }

        /* --- AUTRES UI --- */
        .hud-score {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            font-family: 'Bangers'; font-size: 4rem; color: white; text-shadow: 3px 3px 0 #000; pointer-events: none; z-index: 5;
        }

        .btn {
            background: linear-gradient(#f1c40f, #f39c12);
            border: none; border-bottom: 5px solid #d35400;
            color: #fff; padding: 15px 40px;
            font-family: 'Bangers'; font-size: 1.5rem;
            border-radius: 10px; margin: 10px; cursor: pointer;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }
        .btn:active { transform: translateY(4px); border-bottom-width: 1px; }
        
        .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .shop-item { background: #fff; padding: 10px; border-radius: 8px; text-align: center; }
        .shop-item img { width: 40px; height: 40px; object-fit: contain; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
        <div class="hud-score"><span id="score-val">0</span></div>
        
        <div id="ability-container">
            <div id="ability-btn" ontouchstart="game.useAbility(event)" onmousedown="game.useAbility(event)">
                <span id="ability-icon">👊</span>
                <div id="cd-mask"></div>
            </div>
            <div class="ability-label">POUVOIR</div>
        </div>
    </div>

    <div id="menu-screen" class="screen">
        <h1>FLAPPY MANGA</h1>
        <div style="color:white; margin-bottom:20px; font-size:1.2rem">
            💰 <span id="menu-coins">0</span> | ♦ <span id="menu-gems">0</span>
        </div>
        <button class="btn" onclick="game.start()">JOUER</button>
        <button class="btn" style="background:linear-gradient(#3498db, #2980b9); border-bottom-color:#2c3e50" onclick="ui.openShop()">BOUTIQUE</button>
    </div>

    <div id="shop-screen" class="screen hidden">
        <h2 style="color:white; font-family:'Bangers'">CHOISIS TON HÉROS</h2>
        <div class="shop-grid" id="shop-content"></div>
        <button class="btn" onclick="ui.showMenu()">RETOUR</button>
    </div>

    <div id="gameover-screen" class="screen hidden">
        <h1 style="color:#e74c3c">GAME OVER</h1>
        <h2 style="color:white">Score: <span id="go-score">0</span></h2>
        <button class="btn" onclick="game.start()">REJOUER</button>
        <button class="btn" onclick="ui.showMenu()">MENU</button>
    </div>
</div>

<script>
// --- ASSETS ---
const ASSETS = {
    bg: 'https://raw.githubusercontent.com/Aym-Mas/Flappy-Manga/refs/heads/main/background-day-ds.jpg',
    pipe: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/pipe-green.png',
    gon_free: 'https://raw.githubusercontent.com/Aym-Mas/Flappy-Manga/refs/heads/main/gon.png',
    
    // ZENITSU (Ton lien)
    zen_free: 'https://raw.githubusercontent.com/Aym-Mas/Flappy-Manga/refs/heads/main/zenitsu.png',
    
    ori_free: 'https://raw.githubusercontent.com/Aym-Mas/Flappy-Manga/refs/heads/main/orihime.png',
    tan_pay: 'https://raw.githubusercontent.com/Aym-Mas/Flappy-Manga/refs/heads/main/orihime.png',
    his_pay: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/redbird-midflap.png',
    bya_pay: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-midflap.png'
};

const imgs = {};
for(let k in ASSETS) { imgs[k] = new Image(); imgs[k].src = ASSETS[k]; }

// --- CONFIG ET DATA ---
const CONFIG = {
    stats: {
        destruct: { speed: 4.0, gravity: 0.35, jump: -6.5, icon:'👊', color:'#e74c3c' }, 
        speed:    { speed: 5.5, gravity: 0.30, jump: -5.5, icon:'⚡', color:'#f1c40f' }, 
        collect:  { speed: 4.5, gravity: 0.32, jump: -6.0, icon:'🛡️', color:'#3498db' } 
    },
    abilities: {
        destruct: { cd: 300, duration: 30 },
        speed:    { cd: 200, duration: 120 },
        collect:  { cd: 250, duration: 240 }
    }
};

const CHARS = [
    { id:'gon_free', name:'Gon', arch:'destruct', price:0 },
    { id:'zen_free', name:'Zenitsu', arch:'speed', price:0 },
    { id:'ori_free', name:'Orihime', arch:'collect', price:0 },
    { id:'tan_pay', name:'Tanjiro', arch:'destruct', price:3000 },
    { id:'his_pay', name:'Hisoka', arch:'collect', price:3000 },
    { id:'bya_pay', name:'Byakuya', arch:'speed', price:3000 }
];

// --- MOTEUR ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let animId;

let state = {
    coins: parseInt(localStorage.getItem('fm_c')) || 0,
    inventory: JSON.parse(localStorage.getItem('fm_i')) || ['gon_free', 'zen_free', 'ori_free'],
    selected: localStorage.getItem('fm_s') || 'gon_free'
};

let session = {
    active: false,
    pipes: [], coins: [], particles: [],
    score: 0, frames: 0,
    bird: { y:0, v:0, r:0, stats:null },
    ability: { ready:true, active:false, timer:0, type:'' }
};

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const game = {
    start: () => {
        ui.show('hud');
        const char = CHARS.find(c => c.id === state.selected);
        const stats = CONFIG.stats[char.arch];
        
        const btn = document.getElementById('ability-btn');
        document.getElementById('ability-icon').innerText = stats.icon;
        btn.style.background = `radial-gradient(circle at 30% 30%, ${stats.color}, #000)`;

        session = {
            active: true,
            pipes: [], coins: [], particles: [],
            score: 0, frames: 0,
            bird: { y: canvas.height/2, v:0, r:0, stats: stats, img: imgs[state.selected] },
            ability: { 
                ready: true, active: false, 
                timer: CONFIG.abilities[char.arch].cd,
                maxCd: CONFIG.abilities[char.arch].cd,
                duration: CONFIG.abilities[char.arch].duration,
                type: char.arch
            }
        };
        
        if(animId) cancelAnimationFrame(animId);
        loop();
    },

    update: () => {
        session.bird.v += session.bird.stats.gravity;
        session.bird.y += session.bird.v;
        session.bird.r = Math.min(Math.PI/4, Math.max(-Math.PI/4, session.bird.v * 0.1));

        if(session.bird.y < 0 || session.bird.y + 24 > canvas.height) game.die();

        if(session.frames % 100 === 0) {
            let gap = 160;
            let h = Math.random() * (canvas.height - gap - 100) + 50;
            session.pipes.push({ x:canvas.width, y:0, w:52, h:h, type:'top', destroyed:false });
            session.pipes.push({ x:canvas.width, y:h+gap, w:52, h:canvas.height-h-gap, type:'bot', destroyed:false });
            if(Math.random()>0.5) session.coins.push({ x:canvas.width+26, y:h+gap/2, collected:false });
        }

        session.pipes.forEach(p => {
            p.x -= session.bird.stats.speed;
            if(!p.destroyed) {
                let invincible = session.ability.active && session.ability.type === 'speed';
                if(!invincible) {
                    // HITBOX FIXE 24x14 (Invisible mais c'est elle qui tue)
                    if(checkRect(50+5, session.bird.y+5, 24, 14, p.x, p.y, p.w, p.h)) game.die();
                }
            }
            if(p.type==='top' && p.x+p.w < 50 && !p.passed) {
                p.passed = true; session.score++;
                document.getElementById('score-val').innerText = session.score;
            }
        });

        session.coins.forEach(c => {
            if(session.ability.active && session.ability.type === 'collect' && !c.collected) {
                let dx = 50 - c.x; let dy = session.bird.y - c.y;
                c.x += dx * 0.15; c.y += dy * 0.15; 
            } else {
                c.x -= session.bird.stats.speed;
            }
            if(Math.hypot(50-c.x, session.bird.y-c.y) < 30 && !c.collected) {
                c.collected = true; state.coins++; ui.update();
            }
        });

        if(session.ability.active) {
            session.ability.timer--;
            if(session.ability.timer <= 0) {
                session.ability.active = false;
                session.ability.ready = false;
                session.ability.timer = session.ability.maxCd;
            }
        } else if(!session.ability.ready) {
            session.ability.timer--;
            if(session.ability.timer <= 0) session.ability.ready = true;
        }
        ui.updateCd();

        session.pipes = session.pipes.filter(p => p.x > -60);
        session.coins = session.coins.filter(c => c.x > -60);
        session.frames++;
    },

    draw: () => {
        ctx.drawImage(imgs.bg, 0, 0, canvas.width, canvas.height);

        session.pipes.forEach(p => {
            if(p.destroyed) return;
            if(p.type === 'bot') ctx.drawImage(imgs.pipe, p.x, p.y, p.w, p.h);
            else {
                ctx.save(); ctx.translate(p.x, p.y+p.h); ctx.scale(1,-1);
                ctx.drawImage(imgs.pipe, 0, 0, p.w, p.h); ctx.restore();
            }
        });

        session.coins.forEach(c => {
            if(!c.collected) {
                ctx.fillStyle='gold'; ctx.beginPath(); ctx.arc(c.x,c.y,12,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle='orange'; ctx.lineWidth=2; ctx.stroke();
            }
        });

        ctx.save();
        // On se place au centre du personnage
        ctx.translate(50+17, session.bird.y+12);
        
        if(session.ability.active) {
            if(session.ability.type === 'speed') {
                ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                ctx.fillRect(-60, -10, 60, 20);
            } else if (session.ability.type === 'collect') {
                ctx.strokeStyle = 'cyan'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(0,0, 40, 0, Math.PI*2); ctx.stroke();
            }
        }
        
        ctx.rotate(session.bird.r);
        
        // --- MODIFICATION MAJEURE ICI ---
        // Au lieu de 34x26, on dessine en 60x60 pour que le sprite soit gros
        // Les coordonnées -30, -30 servent à centrer l'image
        let size = 60; 
        ctx.drawImage(session.bird.img, -size/2, -size/2, size, size); 
        
        ctx.restore();

        for(let i=session.particles.length-1; i>=0; i--) {
            let pt = session.particles[i];
            pt.life--; pt.x += pt.vx; pt.y += pt.vy;
            ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, 4, 4);
            if(pt.life<=0) session.particles.splice(i,1);
        }
    },

    die: () => {
        session.active = false;
        localStorage.setItem('fm_c', state.coins);
        document.getElementById('go-score').innerText = session.score;
        ui.show('gameover-screen');
    },

    jump: (e) => {
        if(e) { e.preventDefault(); e.stopPropagation(); }
        if(session.active) session.bird.v = session.bird.stats.jump;
    },

    useAbility: (e) => {
        if(e) { e.preventDefault(); e.stopPropagation(); }
        if(!session.active || !session.ability.ready) return;

        session.ability.active = true;
        session.ability.timer = session.ability.duration; 

        if(session.ability.type === 'destruct') {
            let count = 0;
            session.pipes.forEach(p => {
                if(!p.destroyed && p.x > 0 && count < 6) { 
                    p.destroyed = true;
                    createExplosion(p.x + 26, p.y + p.h/2);
                    count++;
                }
            });
        }
    }
};

const ui = {
    show: (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('hud').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
        ui.update();
    },
    showMenu: () => ui.show('menu-screen'),
    update: () => {
        document.getElementById('menu-coins').innerText = state.coins;
    },
    updateCd: () => {
        let mask = document.getElementById('cd-mask');
        if(!session.ability.ready) {
            let pct = (session.ability.timer / session.ability.maxCd) * 100;
            mask.style.height = pct + '%';
        } else if (session.ability.active) {
            mask.style.height = '0%'; 
            mask.style.background = 'rgba(255,255,255,0.3)';
        } else {
            mask.style.height = '0%';
            mask.style.background = 'rgba(0,0,0,0.7)';
        }
    },
    openShop: () => {
        let html = '';
        CHARS.forEach(c => {
            let owned = state.inventory.includes(c.id);
            let sel = state.selected === c.id;
            html += `
            <div class="shop-item" style="border:3px solid ${sel ? 'green' : '#ddd'}">
                <img src="${ASSETS[c.id]}" style="height:40px; width:auto;"><br>
                <b>${c.name}</b><br>
                ${owned 
                    ? `<button onclick="state.selected='${c.id}';localStorage.setItem('fm_s','${c.id}');ui.openShop()">CHOISIR</button>` 
                    : `<button onclick="if(state.coins>=${c.price}){state.coins-=${c.price};state.inventory.push('${c.id}');localStorage.setItem('fm_i',JSON.stringify(state.inventory));ui.openShop()}">ACHETER ${c.price}</button>`}
            </div>`;
        });
        document.getElementById('shop-content').innerHTML = html;
        ui.show('shop-screen');
    }
};

function checkRect(x1,y1,w1,h1, x2,y2,w2,h2) {
    return x1 < x2+w2 && x1+w1 > x2 && y1 < y2+h2 && y1+h1 > y2;
}

function createExplosion(x, y) {
    for(let i=0; i<15; i++) {
        session.particles.push({
            x:x, y:y, 
            vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, 
            life:20, color:'#e74c3c'
        });
    }
}

function loop() {
    if(session.active) { game.update(); game.draw(); animId = requestAnimationFrame(loop); }
}

canvas.addEventListener('touchstart', game.jump, {passive:false});
canvas.addEventListener('mousedown', game.jump);

ui.showMenu();
</script>
</body>
</html>
