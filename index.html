<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Manga V2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;900&display=swap');

        body {
            margin: 0; padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            touch-action: manipulation; /* Empêche le zoom double tap */
            -webkit-user-select: none; user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%; height: 100vh;
            background: #4ec0ca; /* Couleur ciel flappy */
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* --- UI SCREENS --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
            transition: opacity 0.2s;
        }
        .hidden { display: none !important; }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: #f1c40f;
            text-shadow: 4px 4px 0 #e67e22, -2px -2px 0 #fff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        /* --- CURRENCY BAR (Menu) --- */
        .currency-bar {
            display: flex; gap: 20px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.3);
            margin-bottom: 30px;
            backdrop-filter: blur(5px);
        }
        .curr-item {
            display: flex; align-items: center; gap: 8px;
            font-weight: 900; font-size: 1.2rem; color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .icon-coin { color: #ffd700; filter: drop-shadow(0 0 5px gold); }
        .icon-gem { color: #e84393; filter: drop-shadow(0 0 5px magenta); }

        /* --- BUTTONS --- */
        .btn {
            background: linear-gradient(to bottom, #ff6b6b, #ee5253);
            border: none;
            border-bottom: 6px solid #b33939;
            color: white;
            padding: 15px 40px;
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            border-radius: 15px;
            cursor: pointer;
            margin: 10px;
            min-width: 200px;
            text-shadow: 0 2px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .btn-blue { background: linear-gradient(to bottom, #54a0ff, #2e86de); border-bottom-color: #222f3e; }
        .btn-green { background: linear-gradient(to bottom, #1dd1a1, #10ac84); border-bottom-color: #01a3a4; }

        /* --- HUD (In Game) --- */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        .score-big {
            position: absolute; top: 10%; left: 50%;
            transform: translateX(-50%);
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: white;
            text-shadow: 3px 3px 0 #000;
        }

        #ability-btn {
            position: absolute; bottom: 30px; right: 30px;
            width: 80px; height: 80px;
            background: rgba(0,0,0,0.3);
            border: 4px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; font-family: 'Bangers';
            font-size: 1.5rem;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .cooldown-mask {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background: rgba(255, 0, 0, 0.6);
            transition: height 0.1s linear;
        }

        /* --- SHOP --- */
        #shop-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 8px; width: 95%; max-width: 600px;
        }
        .shop-card {
            background: #fff; border-radius: 8px; padding: 8px;
            text-align: center; color: #333;
            border: 3px solid #ddd;
        }
        .shop-card.selected { border-color: #2ecc71; background: #eaffef; }
        .shop-img { width: 40px; height: 40px; object-fit: contain; }
        .shop-btn {
            width: 100%; padding: 5px; margin-top: 5px;
            font-weight: bold; font-size: 0.8rem;
            border: none; border-radius: 4px; color: white;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
        <div class="score-big"><span id="score-val">0</span><span style="font-size:0.5em">m</span></div>
        <div id="ability-btn" ontouchstart="game.useAbility(event)" onmousedown="game.useAbility(event)">
            POW
            <div id="cd-mask" class="cooldown-mask"></div>
        </div>
    </div>

    <div id="menu-screen" class="screen">
        <h1>FLAPPY MANGA</h1>
        <div class="currency-bar">
            <div class="curr-item"><span class="icon-coin">●</span> <span id="menu-coins">0</span></div>
            <div class="curr-item"><span class="icon-gem">♦</span> <span id="menu-gems">0</span></div>
        </div>
        
        <button class="btn" onclick="game.start()">JOUER</button>
        <button class="btn btn-blue" onclick="ui.openShop()">BOUTIQUE</button>
        <p style="color:#ccc; font-size:0.8rem; margin-top:20px">V2.0 - Mobile Ready</p>
    </div>

    <div id="shop-screen" class="screen hidden">
        <h2 style="font-family:'Bangers'; color:white; font-size:2rem;">SÉLECTION PERSO</h2>
        <div id="shop-grid"></div>
        <button class="btn btn-green" style="padding:10px 30px; font-size:1.2rem;" onclick="ui.showMenu()">RETOUR</button>
    </div>

    <div id="gameover-screen" class="screen hidden">
        <h1>PERDU !</h1>
        <div style="background:#fff; padding:20px; border-radius:10px; width:80%; max-width:300px; text-align:center;">
            <h3 style="margin:0; color:#333">DISTANCE</h3>
            <p style="font-size:2rem; font-weight:900; margin:5px 0" id="go-dist">0m</p>
            <hr>
            <h3 style="margin:0; color:#f1c40f">PIÈCES</h3>
            <p style="font-size:2rem; font-weight:900; margin:5px 0" id="go-coins">+0</p>
        </div>
        <button class="btn" onclick="game.start()">REJOUER</button>
        <button class="btn btn-blue" onclick="ui.showMenu()">MENU</button>
    </div>
</div>

<script>
// --- 1. CHARGEMENT DES ASSETS GITHUB ---
// J'utilise les liens RAW du repo que tu as donné pour avoir de vraies images.
const ASSETS = {
    bg: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/background-day.png',
    pipe: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/pipe-green.png',
    // Mapping des personnages Flappy Manga vers les oiseaux colorés du repo
    gon_free: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/redbird-midflap.png', // Gon = Rouge
    zen_free: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-midflap.png', // Zenitsu = Jaune
    ori_free: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/bluebird-midflap.png', // Orihime = Bleu
    // Pour les autres, on réutilise en attendant tes sprites
    tan_pay: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/bluebird-midflap.png',
    his_pay: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/redbird-midflap.png',
    bya_pay: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-midflap.png',
    coin: 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-upflap.png' // Hack visuel temporaire si pas de pièce, mais on dessine un cercle doré
};

const imgs = {};
let imagesLoaded = 0;
const totalImages = Object.keys(ASSETS).length;

function loadAssets() {
    for (let key in ASSETS) {
        imgs[key] = new Image();
        imgs[key].src = ASSETS[key];
        imgs[key].onload = () => { imagesLoaded++; };
    }
}
loadAssets();

// --- 2. CONFIGURATION & DONNÉES ---
const CONFIG = {
    stats: {
        destruct: { speed: 3.5, gravity: 0.30, jump: -6.5, type: 'Lourd' }, // Gon
        speed:    { speed: 5.0, gravity: 0.25, jump: -5.5, type: 'Vif' },   // Zenitsu
        collect:  { speed: 4.0, gravity: 0.28, jump: -6.0, type: 'Neutre' } // Orihime
    },
    abilities: {
        destruct: { cd: 300 }, // en frames (60 = 1s)
        speed: { cd: 200 },
        collect: { cd: 250 }
    }
};

const CHARACTERS = [
    { id: 'gon_free', name: 'Gon', arch: 'destruct', price: 0 },
    { id: 'zen_free', name: 'Zenitsu', arch: 'speed', price: 0 },
    { id: 'ori_free', name: 'Orihime', arch: 'collect', price: 0 },
    { id: 'tan_pay', name: 'Tanjiro', arch: 'destruct', price: 3000 },
    { id: 'his_pay', name: 'Hisoka', arch: 'collect', price: 3000 },
    { id: 'bya_pay', name: 'Byakuya', arch: 'speed', price: 3000 }
];

// --- 3. MOTEUR DE JEU ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let animationId;

let state = {
    coins: parseInt(localStorage.getItem('fm_c')) || 0,
    gems: parseInt(localStorage.getItem('fm_g')) || 0,
    inventory: JSON.parse(localStorage.getItem('fm_inv')) || ['gon_free', 'zen_free', 'ori_free'],
    selected: localStorage.getItem('fm_sel') || 'gon_free'
};

let session = {
    active: false,
    frames: 0,
    score: 0,
    coins: 0,
    pipes: [],
    gameCoins: [],
    bird: { y: 0, v: 0, r: 0 },
    ability: { ready: true, active: false, timer: 0 }
};

// Redimensionnement
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- 4. LOGIQUE DU JEU ---
const game = {
    start: () => {
        if (imagesLoaded < totalImages) { alert("Chargement des images... Réessaie dans 2 sec"); return; }
        
        ui.showScreen('game-container');
        document.getElementById('hud').classList.remove('hidden');

        const charData = CHARACTERS.find(c => c.id === state.selected);
        const stats = CONFIG.stats[charData.arch];

        session = {
            active: true,
            frames: 0,
            score: 0,
            coins: 0,
            pipes: [],
            gameCoins: [],
            bird: { 
                y: canvas.height / 2, 
                v: 0, 
                r: 0,
                stats: stats,
                img: imgs[state.selected] // Image correspondante
            },
            ability: { 
                ready: true, 
                active: false, 
                timer: CONFIG.abilities[charData.arch].cd,
                maxTimer: CONFIG.abilities[charData.arch].cd
            }
        };
        
        if(animationId) cancelAnimationFrame(animationId);
        loop();
    },

    update: () => {
        // Physique
        session.bird.v += session.bird.stats.gravity;
        session.bird.y += session.bird.v;
        
        // Rotation
        session.bird.r = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (session.bird.v * 0.1)));

        // Sol/Plafond
        if (session.bird.y + 24 >= canvas.height || session.bird.y < 0) game.die();

        // Obstacles (Spawner)
        if (session.frames % 100 === 0) {
            let gap = 160;
            let h = Math.random() * (canvas.height - gap - 100) + 50;
            session.pipes.push({ x: canvas.width, y: 0, h: h, type: 'top', passed:false });
            session.pipes.push({ x: canvas.width, y: h + gap, h: canvas.height - h - gap, type: 'bot', passed:false });
            
            // Pièce
            if (Math.random() > 0.5) {
                session.gameCoins.push({ x: canvas.width + 25, y: h + gap/2, collected: false });
            }
        }

        // Déplacement Pipes
        session.pipes.forEach(p => {
            p.x -= session.bird.stats.speed;
            
            // Collision
            if (!session.ability.active || session.bird.stats.type !== 'Vif') { // Invulnérable si Zenitsu dash
                if (
                    50 < p.x + 52 && 
                    50 + 34 > p.x && 
                    session.bird.y < p.y + p.h && 
                    session.bird.y + 24 > p.y
                ) {
                    game.die();
                }
            }

            // Score
            if (p.type === 'top' && p.x + 52 < 50 && !p.passed) {
                p.passed = true;
                session.score++;
                // Pièce bonus pour l'obstacle
                session.coins++; 
            }
        });

        // Nettoyage
        session.pipes = session.pipes.filter(p => p.x > -60);

        // Pièces
        session.gameCoins.forEach(c => {
            c.x -= session.bird.stats.speed;
            let dx = 50 - c.x;
            let dy = session.bird.y - c.y;
            if (Math.sqrt(dx*dx + dy*dy) < 30 && !c.collected) {
                c.collected = true;
                session.coins++;
            }
        });

        // Cooldown Pouvoir
        if (!session.ability.ready) {
            session.ability.timer--;
            if (session.ability.timer <= 0) session.ability.ready = true;
        } else if (session.ability.active) {
            // Durée active courte (ex: 20 frames)
            session.ability.timer++; 
            if(session.ability.timer > 20) {
                session.ability.active = false; 
                session.ability.ready = false;
                session.ability.timer = session.ability.maxTimer;
            }
        }

        document.getElementById('score-val').innerText = session.score;
        
        // UI Cooldown
        const mask = document.getElementById('cd-mask');
        if (!session.ability.ready) {
            let pct = (session.ability.timer / session.ability.maxTimer) * 100;
            mask.style.height = pct + '%';
        } else {
            mask.style.height = '0%';
        }

        session.frames++;
    },

    draw: () => {
        // Fond
        ctx.drawImage(imgs.bg, 0, 0, canvas.width, canvas.height);

        // Pipes
        session.pipes.forEach(p => {
            if (p.type === 'bot') {
                ctx.drawImage(imgs.pipe, p.x, p.y, 52, p.h);
            } else {
                // Flip pour le tuyau du haut
                ctx.save();
                ctx.translate(p.x + 26, p.y + p.h);
                ctx.scale(1, -1);
                ctx.drawImage(imgs.pipe, -26, 0, 52, p.h);
                ctx.restore();
            }
        });

        // Pièces
        session.gameCoins.forEach(c => {
            if (!c.collected) {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath(); ctx.arc(c.x, c.y, 10, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth=2; ctx.stroke();
            }
        });

        // Joueur
        ctx.save();
        ctx.translate(50 + 17, session.bird.y + 12);
        ctx.rotate(session.bird.r);
        ctx.drawImage(session.bird.img, -17, -12, 34, 24);
        
        // Effet Visuel Pouvoir
        if (session.ability.active) {
            ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0,0, 25, 0, Math.PI*2); ctx.stroke();
        }
        ctx.restore();
    },

    die: () => {
        session.active = false;
        state.coins += session.coins;
        ui.save();
        document.getElementById('go-dist').innerText = session.score + "m";
        document.getElementById('go-coins').innerText = "+" + session.coins;
        ui.showScreen('gameover-screen');
    },

    jump: (e) => {
        if(e) { e.preventDefault(); e.stopPropagation(); }
        if (session.active) session.bird.v = session.bird.stats.jump;
    },

    useAbility: (e) => {
        if(e) { e.preventDefault(); e.stopPropagation(); }
        if (session.active && session.ability.ready) {
            session.ability.active = true;
            session.ability.timer = 0; // Reset timer pour compter la durée active
            // Effet immédiat : Destruction obstacles devant si Gon
        }
    }
};

// --- 5. GESTION UI ---
const ui = {
    save: () => {
        localStorage.setItem('fm_c', state.coins);
        localStorage.setItem('fm_inv', JSON.stringify(state.inventory));
        localStorage.setItem('fm_sel', state.selected);
        ui.update();
    },
    update: () => {
        document.getElementById('menu-coins').innerText = state.coins;
        document.getElementById('menu-gems').innerText = state.gems;
    },
    showScreen: (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        if(id !== 'game-container') document.getElementById('hud').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
        ui.update();
    },
    showMenu: () => ui.showScreen('menu-screen'),
    openShop: () => {
        const grid = document.getElementById('shop-grid');
        grid.innerHTML = '';
        CHARACTERS.forEach(c => {
            const owned = state.inventory.includes(c.id);
            const selected = state.selected === c.id;
            const div = document.createElement('div');
            div.className = `shop-card ${selected ? 'selected' : ''}`;
            div.innerHTML = `
                <img src="${ASSETS[c.id]}" class="shop-img">
                <div style="font-weight:bold; margin:5px 0">${c.name}</div>
                <div style="font-size:0.7rem; color:#666">${c.arch.toUpperCase()}</div>
                ${owned 
                    ? `<button class="shop-btn" style="background:#2ecc71" onclick="ui.equip('${c.id}')">${selected ? 'ÉQUIPÉ' : 'CHOISIR'}</button>`
                    : `<button class="shop-btn" style="background:#3498db" onclick="ui.buy('${c.id}')">${c.price} ₱</button>`
                }
            `;
            grid.appendChild(div);
        });
        ui.showScreen('shop-screen');
    },
    buy: (id) => {
        const char = CHARACTERS.find(c => c.id === id);
        if (state.coins >= char.price) {
            state.coins -= char.price;
            state.inventory.push(id);
            ui.save();
            ui.openShop();
        } else { alert("Pas assez de pièces !"); }
    },
    equip: (id) => {
        state.selected = id;
        ui.save();
        ui.openShop();
    }
};

// Boucle principale
function loop() {
    if (session.active) {
        game.update();
        game.draw();
        animationId = requestAnimationFrame(loop);
    }
}

// Contrôles
canvas.addEventListener('mousedown', game.jump);
canvas.addEventListener('touchstart', game.jump, {passive: false});

// Init
ui.update();

</script>
</body>
</html>
